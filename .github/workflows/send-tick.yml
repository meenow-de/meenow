name: Send notification tick

# Runs all day: the script gates each subscription to its own local-time trigger
# window (see the tz field in subscription files), so most runs send nothing.
# Skipping the checkout when idle is not possible — the gate depends on per-file
# timezones stored in the subscriptions repo.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: meenow-de/meenow-push
          token: ${{ secrets.PUSH_SUBS_TOKEN }}
          path: push-subs

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install script dependencies
        run: npm install
        working-directory: scripts

      - name: Send tick
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: mailto:2qhhabkrd@mozmail.com
          SUBS_DIR: push-subs/${{ secrets.VITE_PUSH_SUBS_PATH }}
          DEFAULT_TZ: Europe/Berlin
        run: node scripts/send-tick.mjs

      # xkcd sends no CORS headers, so the app reads this mirror from the
      # push repo instead (src/api/xkcd.ts). Fail-soft: never blocks the tick.
      - name: Mirror xkcd comic
        env:
          OUT_FILE: push-subs/xkcd.json
        run: node scripts/fetch-xkcd.mjs

      - name: Commit push-repo changes
        working-directory: push-subs
        env:
          SUBS_PATH: ${{ secrets.VITE_PUSH_SUBS_PATH }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$SUBS_PATH/"
          [ ! -f xkcd.json ] || git add xkcd.json
          # Rebase first: the dev and prod repos run this workflow on the same
          # schedule against the same push repo, so pushes can race.
          git diff --staged --quiet || (git commit -m "Update push data" && git pull --rebase && git push)

      # The client-shipped relay token (VITE_PUSH_RELAY_TOKEN) fails silently in
      # the app when it expires, breaking new-device subscription registration.
      # Fail the job here so GitHub's workflow-failure email surfaces it. Runs
      # last so an expired token never blocks the tick send itself.
      - name: Check relay token validity
        env:
          RELAY_TOKEN: ${{ secrets.VITE_PUSH_RELAY_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            https://api.github.com/repos/meenow-de/meenow-push/contents/xkcd.json)
          if [ "$status" != "200" ]; then
            echo "::error::Relay token check failed (HTTP $status) — VITE_PUSH_RELAY_TOKEN is expired or invalid. Rotate the fine-grained PAT (Contents read/write on meenow-de/meenow-push), update the secret in both repos, and redeploy."
            exit 1
          fi
